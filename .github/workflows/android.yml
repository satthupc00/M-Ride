name: Build & Release

on:
  push:
    branches: [ main, ccr-cf10c2f3-u6vnmx ]
    paths-ignore: [ 'design/**', '**.md' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Khoá ký app + cấu hình đồng bộ (từ Secrets)
        id: keys
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$KS" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KS" | base64 -d > app/mride-release.jks
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Chưa có KEYSTORE_BASE64 / KEYSTORE_PASSWORD - chỉ build thử, không phát hành"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$GS" ] && [ ! -f app/google-services.json ]; then echo "$GS" > app/google-services.json; fi

      - name: Build APK
        run: chmod +x gradlew && ./gradlew assembleRelease --stacktrace

      - name: Đọc version
        id: v
        run: echo "version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: M-Ride-v${{ steps.v.outputs.version }}
          path: app/build/outputs/apk/release/*.apk

      - name: Ghi chú phát hành từ whatsnew.json
        run: |
          python3 - <<'PY'
          import json
          w = json.load(open('app/src/main/assets/whatsnew.json', encoding='utf-8'))
          out = []
          for key, title in (('new', 'Mới'), ('improved', 'Cải thiện'), ('fixed', 'Sửa lỗi')):
              if w.get(key):
                  out.append('### ' + title)
                  out += ['- ' + x for x in w[key]]
                  out.append('')
          open('notes.md', 'w', encoding='utf-8').write('\n'.join(out))
          PY

      - name: Kiểm tra tag đã có chưa
        id: tag
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.v.outputs.version }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tạo bản phát hành
        if: steps.tag.outputs.exists == 'false' && steps.keys.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: M Ride v${{ steps.v.outputs.version }}
          body_path: notes.md
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: app/build/outputs/apk/release/M-Ride-v${{ steps.v.outputs.version }}.apk
