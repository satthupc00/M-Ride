<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>M Ride · Hành trình</title>
<meta property="og:title" content="M Ride · Xem lại hành trình">
<meta property="og:description" content="Bấm để xem lại đường đi trên bản đồ. Link tự hết hạn sau 24 giờ.">
<meta property="og:image" content="icon.png">
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css">
<style>
:root{
  --chrome:#1F2126; --panel:#26292F; --line:#363A42; --text:#E8E9EC; --muted:#8D929C;
  --red:#E5383B; --selected:#3A2426; --track:#474C55; --credit:#6B707A;
  --ease-out:cubic-bezier(.22,1,.36,1); --ease-spring:cubic-bezier(.34,1.56,.64,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--chrome);color:var(--text);
  font:14px/1.4 "Segoe UI",Roboto,system-ui,sans-serif;overflow:hidden}
#map{position:fixed;inset:0}
.maplibregl-ctrl-attrib{font-size:10px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;
  transition:background-color .12s ease,border-color .12s ease,transform .22s var(--ease-out),box-shadow .22s var(--ease-out)}
button:active{transform:scale(.95);transition-duration:.06s}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}

.top{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(14px,env(safe-area-inset-right,0px)) 18px max(14px,env(safe-area-inset-left,0px));
  background:linear-gradient(rgba(31,33,38,.95),rgba(31,33,38,.75) 60%,rgba(31,33,38,0))}
.brand{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.brand img{width:34px;height:34px}
.brand span{font-size:17px;font-weight:700;line-height:34px;white-space:nowrap}
.brand .m{color:var(--red)}
.trip{min-width:0;margin-left:auto;text-align:right}
.trip b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trip span{display:block;font-size:12px;color:var(--muted)}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;flex-direction:column;gap:8px;
  padding:0 max(10px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 6px) max(10px,env(safe-area-inset-left,0px))}
@media (min-width:760px){.dock{right:auto;width:440px;left:14px;bottom:10px}}
.chips{display:flex;gap:8px;justify-content:flex-end}
.mchip{display:flex;align-items:center;gap:7px;border:0;border-radius:24px;padding:10px 14px 10px 12px;
  background:rgba(31,33,38,.92);color:#fff;font-weight:600;font-size:12.5px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.mchip.on{background:var(--red)}
.mchip svg{width:16px;height:16px}
.mchip.round{padding:0;width:40px;height:40px;justify-content:center}
.mchip.round svg{width:22px;height:22px;transition:transform .15s linear}
.tlabel{background:rgba(31,33,38,.92);color:#fff;font-weight:700;font-size:12px;padding:3px 8px;border-radius:10px;
  font-variant-numeric:tabular-nums;white-space:nowrap;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.tlabel.hover{background:#fff;color:#1F2126}
.card{background:rgba(38,41,47,.97);border:1px solid var(--line);border-radius:16px;padding:12px 14px 14px;
  display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat{background:var(--chrome);border-radius:10px;padding:8px 4px 7px;text-align:center}
.stat b{display:block;font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat b small{font-size:11px;color:var(--muted);font-weight:600}
.stat span{font-size:10.5px;color:var(--muted)}
.ptop{display:flex;align-items:center;gap:10px}
.clock{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.meta{font-size:12px;color:var(--muted)}
.spd{margin-left:auto;text-align:right}
.spd b{font-size:22px;font-variant-numeric:tabular-nums}
.spd small{display:block;font-size:11px;color:var(--muted)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(to right,var(--red) var(--fill,0%),var(--track) var(--fill,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-6px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(229,56,59,.25)}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:var(--track)}
input[type=range]::-moz-range-progress{height:4px;border-radius:4px;background:var(--red)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:#fff}
.ctl{display:flex;align-items:center;gap:8px}
.play{width:50px;height:50px;border-radius:50%;border:0;background:var(--red);color:#fff;display:grid;place-items:center;flex:0 0 auto}
.play:hover{background:#F04447;box-shadow:0 6px 16px rgba(229,56,59,.35)}
.play svg{width:20px;height:20px}
.rates{display:flex;gap:5px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.rate{border:1px solid var(--line);background:var(--chrome);border-radius:14px;font-weight:700;font-size:12px;padding:6px 10px;font-variant-numeric:tabular-nums}
.rate.on{background:var(--selected);border-color:var(--red)}
.foot{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:var(--credit);padding:0 2px}

.state{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:var(--chrome);padding:24px;text-align:center}
.state[hidden]{display:none}
.state img{width:64px;height:64px;margin-bottom:10px}
.state h1{font-size:20px;margin:0 0 6px}
.state p{margin:0;color:var(--muted);max-width:34ch}
.state .credit{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);font-size:11px;color:var(--credit)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="map"></div>

<header class="top">
  <div class="brand"><img src="icon.png" alt=""><span><span class="m">M</span> Ride</span></div>
  <div class="trip"><b id="tname">Hành trình</b><span id="tdate"></span></div>
</header>

<div class="dock">
  <div class="chips">
    <button class="mchip round" id="northBtn" title="Về hướng Bắc" aria-label="Về hướng Bắc"></button>
    <button class="mchip" id="rotBtn" title="Xoay bản đồ theo hướng xe"></button>
    <button class="mchip on" id="folBtn" title="Camera chạy theo xe"></button>
  </div>
  <section class="card">
    <div class="stats" id="stats"></div>
    <div class="ptop">
      <div><div class="clock" id="clock">--:--:--</div><div class="meta" id="meta"></div></div>
      <div class="spd"><b id="spd">0</b><small>km/h</small></div>
    </div>
    <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Tua hành trình">
    <div class="ctl">
      <button class="play" id="playBtn" aria-label="Phát / tạm dừng"></button>
      <div class="rates" id="rates"></div>
    </div>
  </section>
  <div class="foot"><span id="expiry"></span><span>Created by Mondiro</span></div>
</div>

<div class="state" id="state"><div><img src="icon.png" alt=""><h1 id="stTitle">Đang tải hành trình…</h1><p id="stText"></p></div><div class="credit">Created by Mondiro</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"></script>
<script>
const PROJECT = 'm-ride-4e13e';
const API_KEY = 'AIzaSyADH55Tj6ERIWyvridAvg3DfQM8qjNZvLM';
const STYLE = 'https://tiles.openfreemap.org/styles/liberty';
const RED = '#E5383B', FADED = '#C9A3A4';
const ICON = {
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.7l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="5" height="16" rx="1"/><rect x="13" y="4" width="5" height="16" rx="1"/></svg>',
  nav: f => `<svg viewBox="0 0 24 24" fill="${f ? '#fff' : 'none'}" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M3 11 22 2 13 21 11 13z"/></svg>`,
  north: '<svg viewBox="0 0 24 24"><path d="M12 2 16 12H8z" fill="#E5383B"/><path d="M12 22 8 12h8z" fill="#fff"/></svg>',
  compass: f => `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88z" fill="${f ? '#fff' : 'none'}"/></svg>`,
};
const $ = id => document.getElementById(id);
const vi = new Intl.NumberFormat('vi-VN', {maximumFractionDigits: 1, minimumFractionDigits: 1});
const pad = n => String(n).padStart(2, '0');
const hms = t => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
const hm = t => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const WD = ['Chủ nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
const dayLabel = t => { const d = new Date(t); return `${WD[d.getDay()]}, ${pad(d.getDate())}/${pad(d.getMonth()+1)}`; };
const dur = ms => { const m = Math.round(ms / 60000); return m >= 60 ? `${Math.floor(m/60)}:${pad(m%60)}` : `${m} ph`; };

function showState(title, text) { $('stTitle').textContent = title; $('stText').textContent = text || ''; $('state').hidden = false; }

function decode(s) {
  const out = []; let i = 0, lat = 0, lon = 0;
  const next = () => { let r = 0, sh = 0, b; do { b = s.charCodeAt(i++) - 63; r |= (b & 31) << sh; sh += 5; } while (b >= 32 && i < s.length); return (r & 1) ? ~(r >> 1) : (r >> 1); };
  while (i < s.length) { lat += next(); if (i >= s.length) break; lon += next(); out.push([lon / 1e5, lat / 1e5]); }
  return out;
}

function fsVal(v) {
  if (!v) return undefined;
  if ('stringValue' in v) return v.stringValue;
  if ('integerValue' in v) return Number(v.integerValue);
  if ('doubleValue' in v) return v.doubleValue;
  if ('timestampValue' in v) return Date.parse(v.timestampValue);
  if ('booleanValue' in v) return v.booleanValue;
  return undefined;
}

async function load(id) {
  if (id === 'demo') return demo();
  const url = `https://firestore.googleapis.com/v1/projects/${PROJECT}/databases/(default)/documents/shares/${encodeURIComponent(id)}?key=${API_KEY}`;
  const r = await fetch(url);
  if (r.status === 404 || r.status === 403) return {expired: true};
  if (!r.ok) throw new Error('http ' + r.status);
  const f = (await r.json()).fields || {};
  const d = {}; for (const k in f) d[k] = fsVal(f[k]);
  if (!d.expiresAt || d.expiresAt < Date.now()) return {expired: true};
  return d;
}

function demo() {
  // dữ liệu mẫu để xem trước giao diện
  const pts = [[106.6655,10.7925],[106.6702,10.7891],[106.6760,10.7860],[106.6822,10.7838],[106.6868,10.7811],[106.6905,10.7790],[106.6950,10.7772],[106.6988,10.7760],[106.7012,10.7742],[106.7045,10.7728],[106.7080,10.7716]];
  const dense = []; for (let i = 0; i < pts.length - 1; i++) for (let k = 0; k < 20; k++) { const f = k / 20; dense.push([pts[i][0] + (pts[i+1][0]-pts[i][0])*f, pts[i][1] + (pts[i+1][1]-pts[i][1])*f]); }
  const start = Date.now() - 3 * 3600e3;
  return { name: 'Quận 3 → Quận 1', start, end: start + 1500e3, dist: 5200, max: 41, expiresAt: Date.now() + 20 * 3600e3,
    _coords: dense, _ts: dense.map((_, i) => i * 7.5), _sp: dense.map((_, i) => Math.round(22 + 12 * Math.sin(i / 9))) };
}

(async function main() {
  const id = new URLSearchParams(location.search).get('id');
  if (!id) return showState('Không có hành trình', 'Link này thiếu mã hành trình.');
  let d;
  try { d = await load(id); } catch (e) { return showState('Không tải được hành trình', 'Kiểm tra kết nối mạng rồi tải lại trang.'); }
  if (d.expired) return showState('Link đã hết hạn', 'Hành trình chỉ được chia sẻ trong 24 giờ và đã được xoá.');

  const coords = d._coords || decode(d.poly || '');
  const ts = d._ts || (d.ts || '').split(',').map(Number);
  const sp = d._sp || (d.sp || '').split(',').map(Number);
  if (coords.length < 2) return showState('Hành trình trống', 'Không có đủ dữ liệu để phát lại.');

  // dòng thời gian ảo: các khoảng nghỉ dài được rút còn 2 giây
  const n = coords.length, vt = new Float64Array(n);
  for (let i = 1; i < n; i++) { const dt = (ts[i] ?? i) - (ts[i-1] ?? i-1); vt[i] = vt[i-1] + (dt > 120 ? 2 : Math.max(0, dt)); }
  const total = vt[n-1];
  const idx = t => { let lo = 0, hi = n - 1; while (lo < hi) { const m = (lo + hi + 1) >> 1; if (vt[m] <= t) lo = m; else hi = m - 1; } return lo; };
  const frac = (i, t) => i >= n - 1 ? 0 : Math.min(1, Math.max(0, (t - vt[i]) / ((vt[i+1] - vt[i]) || 1)));
  const pos = t => { const i = idx(t); if (i >= n - 1) return coords[n-1]; const f = frac(i, t); return [coords[i][0] + (coords[i+1][0]-coords[i][0])*f, coords[i][1] + (coords[i+1][1]-coords[i][1])*f]; };
  const clock = t => { const i = idx(t); const base = d.start + (ts[i] ?? 0) * 1000; if (i >= n - 1) return base; return base + ((ts[i+1] - ts[i]) * 1000) * frac(i, t); };
  const speed = t => { const i = idx(t); if (i >= n - 1) return sp[n-1] || 0; return (sp[i] || 0) + ((sp[i+1] || 0) - (sp[i] || 0)) * frac(i, t); };
  const heading = t => { const a = pos(t), b = pos(Math.min(total, t + 10)); const dy = b[1]-a[1], dx = (b[0]-a[0]) * Math.cos(a[1]*Math.PI/180); if (Math.hypot(dx, dy) < 3e-5) return null; return (Math.atan2(dx, dy) * 180 / Math.PI + 360) % 360; };

  // thông tin chuyến
  $('tname').textContent = d.name || 'Hành trình';
  $('tdate').textContent = `${dayLabel(d.start)} · ${hm(d.start)}–${hm(d.end)}`;
  $('meta').textContent = d.name || '';
  const durMs = d.end - d.start, avg = durMs > 0 ? (d.dist / 1000) / (durMs / 3.6e6) : 0;
  $('stats').innerHTML = [
    [vi.format(d.dist / 1000), 'km', 'Quãng đường'], [dur(durMs), '', 'Thời gian'],
    [Math.round(avg), 'km/h', 'Trung bình'], [Math.round(d.max || 0), 'km/h', 'Tối đa'],
  ].map(([v, u, l]) => `<div class="stat"><b>${v}${u ? ` <small>${u}</small>` : ''}</b><span>${l}</span></div>`).join('');
  $('expiry').textContent = `Link hết hạn lúc ${hm(d.expiresAt)} ${pad(new Date(d.expiresAt).getDate())}/${pad(new Date(d.expiresAt).getMonth()+1)}`;

  // trạng thái phát lại
  let t = 0, playing = true, rate = 60, follow = true, rotate = false, camB = 0, followLockUntil = 0, toNorth = false;
  const RATES = [1, 10, 30, 60, 120];
  $('rates').innerHTML = RATES.map(r => `<button class="rate${r === rate ? ' on' : ''}" data-r="${r}">${r}×</button>`).join('');
  $('rates').onclick = e => { const b = e.target.closest('[data-r]'); if (!b) return; rate = +b.dataset.r; [...$('rates').children].forEach(x => x.classList.toggle('on', x === b)); };
  const paintChips = () => {
    $('folBtn').classList.toggle('on', follow); $('folBtn').innerHTML = ICON.nav(follow) + (follow ? 'Đang bám xe' : 'Bám theo xe');
    $('rotBtn').classList.toggle('on', rotate); $('rotBtn').innerHTML = ICON.compass(rotate) + 'Xoay theo xe';
    $('playBtn').innerHTML = playing ? ICON.pause : ICON.play;
  };
  $('northBtn').innerHTML = ICON.north;
  paintChips();

  const plain = new URLSearchParams(location.search).get('style') === 'plain';
  const map = new maplibregl.Map({
    container: 'map', attributionControl: {compact: true},
    style: plain ? {version: 8, sources: {}, layers: [{id: 'bg', type: 'background', paint: {'background-color': '#E9E6DF'}}]} : STYLE,
    center: coords[0], zoom: 14, dragRotate: true, pitchWithRotate: false, touchPitch: false, maxPitch: 0,
  });

  const bottomPad = () => (window.innerWidth >= 760 ? 40 : document.querySelector('.dock').offsetHeight + 10);
  const camPad = () => window.innerWidth >= 760
    ? {top: 90, bottom: 40, left: 480, right: 40}
    : {top: 90, bottom: bottomPad(), left: 30, right: 30};
  const fc = feats => ({type: 'FeatureCollection', features: feats});
  const pt = c => ({type: 'Feature', geometry: {type: 'Point', coordinates: c}, properties: {}});
  const ln = cs => ({type: 'Feature', geometry: {type: 'LineString', coordinates: cs}, properties: {}});


  map.on('load', () => {
    // nhãn tiếng Việt
    const nameLayers = new Set(['place','transportation_name','water_name','poi','aerodrome_label','mountain_peak','park','waterway','aeroway']);
    for (const l of map.getStyle().layers) {
      if (l.type !== 'symbol' || !nameLayers.has(l['source-layer']) || /shield|housenumber|ref/.test(l.id)) continue;
      try { map.setLayoutProperty(l.id, 'text-field', ['coalesce', ['get', 'name:vi'], ['get', 'name'], ['get', 'name:latin']]); } catch (e) {}
    }
    map.addSource('route', {type: 'geojson', data: ln(coords)});
    map.addSource('prog', {type: 'geojson', data: fc([])});
    map.addSource('start', {type: 'geojson', data: pt(coords[0])});
    map.addSource('dot', {type: 'geojson', data: pt(coords[0])});
    const lineLayout = {'line-cap': 'round', 'line-join': 'round'};
    map.addLayer({id: 'route', type: 'line', source: 'route', layout: lineLayout, paint: {'line-color': FADED, 'line-width': 5}});
    map.addLayer({id: 'route-hit', type: 'line', source: 'route', layout: lineLayout, paint: {'line-color': '#000', 'line-width': 28, 'line-opacity': 0}});
    map.addLayer({id: 'prog-glow', type: 'line', source: 'prog', layout: lineLayout, paint: {'line-color': RED, 'line-width': 12, 'line-opacity': .22}});
    map.addLayer({id: 'prog', type: 'line', source: 'prog', layout: lineLayout, paint: {'line-color': RED, 'line-width': 5}});
    map.addLayer({id: 'start', type: 'circle', source: 'start', paint: {'circle-radius': 6, 'circle-color': '#1F2126', 'circle-stroke-color': '#fff', 'circle-stroke-width': 3}});
    map.addLayer({id: 'dot-halo', type: 'circle', source: 'dot', paint: {'circle-radius': 16, 'circle-color': RED, 'circle-opacity': .25}});
    map.addLayer({id: 'dot', type: 'circle', source: 'dot', paint: {'circle-radius': 7.5, 'circle-color': RED, 'circle-stroke-color': '#fff', 'circle-stroke-width': 3}});
    timeMarker.setLngLat(coords[0]).addTo(map);
    if (id === 'demo') window.__mr = {map, coords}; // chỉ dùng để kiểm thử với dữ liệu mẫu
    $('state').hidden = true;
    map.jumpTo({center: coords[0], zoom: 16.5, padding: camPad()});
    requestAnimationFrame(loop);
  });

  // Zoom (2 ngón / lăn chuột) vẫn bám xe: phóng to quanh xe. Kéo 1 ngón / chuột → tắt bám xe, giữ nguyên khung nhìn.
  map.scrollZoom.enable({around: 'center'});
  map.touchZoomRotate.enable({around: 'center'});
  // Theo dõi ngón tay/chuột: kéo 1 ngón > 6px → tắt bám xe. Khi đang chạm thì tạm dừng cập nhật camera
  // để thao tác kéo/zoom không bị cắt ngang.
  const cv = map.getCanvasContainer();
  const pointers = new Map();
  cv.addEventListener('pointerdown', e => { pointers.set(e.pointerId, {x: e.clientX, y: e.clientY, btn: e.button, ctrl: e.ctrlKey}); });
  cv.addEventListener('pointermove', e => {
    const p0 = pointers.get(e.pointerId);
    if (!p0 || pointers.size !== 1 || !follow || p0.btn !== 0 || p0.ctrl) return;
    if (Math.hypot(e.clientX - p0.x, e.clientY - p0.y) > 6) { follow = false; paintChips(); }
  });
  const lift = e => pointers.delete(e.pointerId);
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => cv.addEventListener(ev, lift));
  const flyToCar = () => {
    followLockUntil = performance.now() + 650;
    const z = map.getZoom() < 14 ? 16.5 : map.getZoom();
    map.easeTo({center: pos(t), zoom: z, padding: camPad(), duration: 600});
  };
  $('folBtn').onclick = () => { follow = !follow; paintChips(); if (follow) flyToCar(); };
  $('rotBtn').onclick = () => {
    rotate = !rotate; toNorth = false;
    if (rotate && !follow) { follow = true; flyToCar(); }
    camB = map.getBearing(); paintChips();
  };
  // Về hướng Bắc: khi đang bám xe thì xoay dần trong vòng lặp (để không bị camera bám xe cắt ngang)
  $('northBtn').onclick = () => {
    rotate = false; paintChips();
    if (follow) { camB = map.getBearing(); toNorth = true; }
    else map.easeTo({bearing: 0, duration: 400});
  };
  // Xoay tự do bằng giữ chuột phải (hoặc 2 ngón trên điện thoại): tắt chế độ xoay theo xe
  map.on('rotatestart', e => { if (e.originalEvent) { rotate = false; toNorth = false; paintChips(); } });
  map.on('rotateend', () => { camB = map.getBearing(); });
  map.on('rotate', () => { $('northBtn').firstChild.style.transform = `rotate(${-map.getBearing()}deg)`; });

  // Bấm vào một điểm trên đường đi → tua tới đó; rê chuột → hiện giờ đi qua
  const nearestIdx = pt0 => {
    let best = -1, bd = 1e9;
    for (let k = 0; k < n; k++) { const q = map.project(coords[k]); const dd = (q.x - pt0.x) ** 2 + (q.y - pt0.y) ** 2; if (dd < bd) { bd = dd; best = k; } }
    return bd < 32 * 32 ? best : -1;
  };
  map.on('click', e => {
    if (!map.queryRenderedFeatures(e.point, {layers: ['route-hit']}).length) return;
    const k = nearestIdx(e.point); if (k < 0) return;
    t = vt[k];
    if (follow) followLockUntil = 0;
  });
  const tlEl = document.createElement('div'); tlEl.className = 'tlabel';
  const timeMarker = new maplibregl.Marker({element: tlEl, anchor: 'bottom', offset: [0, -16]});
  const hoverEl = document.createElement('div'); hoverEl.className = 'tlabel hover';
  const hoverMarker = new maplibregl.Marker({element: hoverEl, anchor: 'bottom', offset: [0, -12]});
  let hoverOn = false;
  map.on('mousemove', 'route-hit', e => {
    map.getCanvas().style.cursor = 'pointer';
    const k = nearestIdx(e.point); if (k < 0) return;
    hoverEl.textContent = hm(clock(vt[k]));
    hoverMarker.setLngLat(coords[k]); if (!hoverOn) { hoverMarker.addTo(map); hoverOn = true; }
  });
  map.on('mouseleave', 'route-hit', () => { map.getCanvas().style.cursor = ''; hoverMarker.remove(); hoverOn = false; });
  $('playBtn').onclick = () => { if (t >= total) t = 0; playing = !playing; paintChips(); };
  const scrub = $('scrub');
  scrub.oninput = () => { t = scrub.value / 1000 * total; };

  let last = 0;
  function loop(now) {
    const dt = last ? (now - last) / 1000 : 0; last = now;
    if (playing) { t = Math.min(total, t + dt * rate); if (t >= total) { playing = false; paintChips(); } }
    const p = pos(t), i = idx(t);
    map.getSource('prog').setData(ln(coords.slice(0, i + 1).concat([p])));
    map.getSource('dot').setData(pt(p));
    if (follow && now > followLockUntil && pointers.size === 0) {
      const opts = {center: p, padding: camPad()};
      if (rotate) { const h = heading(t); if (h != null) { const dl = ((h - camB + 540) % 360) - 180; camB = (camB + dl * 0.12 + 360) % 360; } opts.bearing = camB; }
      else if (toNorth) { const dl = ((0 - camB + 540) % 360) - 180; camB = Math.abs(dl) < 0.5 ? 0 : (camB + dl * 0.15 + 360) % 360; if (camB === 0) toNorth = false; opts.bearing = camB; }
      map.jumpTo(opts);
    }
    timeMarker.setLngLat(p); tlEl.textContent = hm(clock(t));
    $('clock').textContent = hms(clock(t));
    $('spd').textContent = Math.round(speed(t));
    if (document.activeElement !== scrub) scrub.value = total ? t / total * 1000 : 0;
    scrub.style.setProperty('--fill', (total ? t / total * 100 : 0) + '%');
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
